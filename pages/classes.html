<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Class Schedules - Iris Sim Gwek Keow</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../icons/favicon.ico" />
  <script src="../index.js"></script>
  <script src="../data/classes.js"></script>
  <script src="../classes.js"></script>
</head>

<body>

  <main class="page-container">

    <div class="bg-container bg-blur">
      <div class="header-container-sub">
        <a href="../index.html" class="back-chevron-btn" aria-label="Back to landing page">
          <span class="chevrons">&lt;</span>
          <span>Home</span>
        </a>
        <h1>Class Schedules</h1>
      </div>
    </div>

    <div class="container-sub">

      <h2>Leave Dates (No Class)</h2>
      <div class="leave-dates-card">
        <ul class="leave-dates-list" id="leave-dates-list">
          <!-- Populated dynamically from JSON -->
        </ul>
      </div>

      <h2>Overall Schedule</h2>

      <div class="schedule-img-actions-container">
        <button onclick="openInNewTab('../images/schedule.png')">
          <img class="ext-open" src="../icons/ext.svg" alt="Open" />
          <span class="ext-open-label">
            Open Schedule in New Tab
          </span>
        </button>
      </div>
      <div class="schedule-img-container">
        <img src="../images/schedule.png" alt="Overall Class Schedule" />
      </div>
      <span>*you can scroll the image sideways</span>

      <div class="break"></div>

      <div class="note" id="note-banner">
        <!-- Populated dynamically from JSON -->
      </div>

      <h2>Locations &amp; Weekly Classes</h2>
      <p class="section-intro-text">Check them out below and secure your slots early. See you there!</p>

      <div class="bookings-container" id="bookings-container">
        <!-- Populated dynamically from JSON -->
      </div>

    </div>

  </main>

</body>

</html>
